<script>
        // Simple Timer Logic for visualization
        let seconds = 1500; // 25 minutes
        let timerId = null;
        const display = document.getElementById('timer-display');
        const progressRing = document.getElementById('timer-progress');
        const toggleBtn = document.getElementById('toggle-btn');
        const playIcon = document.getElementById('play-icon');
        const toggleText = toggleBtn.querySelector('span:not(.material-symbols-outlined)');

        const totalLength = 1000; // Simplified dasharray match

        function updateDisplay() {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            display.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            // Update progress ring (clockwise depletion)
            const percentage = seconds / 1500;
            progressRing.style.strokeDashoffset = totalLength * (1 - percentage);
        }

        function startTimer() {
            if (timerId) return;
            timerId = setInterval(() => {
                if (seconds > 0) {
                    seconds--;
                    updateDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                }
            }, 1000);
            playIcon.textContent = 'pause';
            toggleText.textContent = 'Pause';
        }

        function stopTimer() {
            clearInterval(timerId);
            timerId = null;
            playIcon.textContent = 'play_arrow';
            toggleText.textContent = 'Resume';
        }

        toggleBtn.addEventListener('click', () => {
            if (timerId) stopTimer();
            else startTimer();
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            stopTimer();
            seconds = 1500;
            updateDisplay();
            playIcon.textContent = 'play_arrow';
            toggleText.textContent = 'Start';
        });

        // Initialize display
        updateDisplay();
        startTimer(); // Auto-start for preview
    </script>
